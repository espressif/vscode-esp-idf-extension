name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Upload .vsix in release asset
    if: ${{ !contains(github.ref, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: yarn

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF:11}" >> $GITHUB_OUTPUT

      - name: VSIX Package
        run: yarn run package

      - uses: ncipollo/release-action@v1
        with:
          artifactErrorsFailBuild: true
          artifacts: "esp-idf-extension.vsix"
          name: ESP IDF VSCode Extension Release ${{ github.ref }}
          draft: true
          body: |
            ### Release Highlights

            ### Features & Enhancements

            <!-- Insert The Features and Enhancements below as points possibly add the link to the PR/commit -->

            ### Bug Fixes

            <!-- Insert The Bug Fixes below as points, also add relevant links -->

      - name: Marketplace release
        run: yarn run release

      - name: OpenVSX release
        run: yarn run open-vsx-release

  pre-release:
    name: Publish pre-release
    if: ${{ contains(github.ref, '-rc.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Dependencies
        run: yarn

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(echo $TAG | sed 's/-rc.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update package.json version
        run: yarn version --new-version $VERSION --no-git-tag-version

      - name: VSIX Package
        run: yarn run package --pre-release

      - name: Marketplace release
        run: yarn run release --pre-release

      - name: OpenVSX release
        run: yarn run open-vsx-release --pre-release
