name: Run sync-athena
description: Pull gitlab.espressif.cn:5050/idf/sync-athena and run one sync mode.

inputs:
  mode:
    description: issue_to_task, comment_to_task, or pr_to_comment
    required: true
  issue_number:
    description: Backfill issue number(s); used only for workflow_dispatch
    required: false
    default: ""
  image:
    description: sync-athena image built by the idf/sync-athena GitLab pipeline
    required: false
    default: gitlab.espressif.cn:5050/idf/sync-athena:latest
  ticket_prefix:
    description: Ticket key prefix; issue #42 becomes <prefix>-42
    required: false
    default: VSC
  editors:
    description: Comma-separated editor emails
    required: false
    default: ""
  co_authors:
    description: Comma-separated co-author emails
    required: false
    default: ""
  email_domain:
    description: Domain used to expand bare usernames in editors/co_authors
    required: false
    default: espressif.com
  athena_project_uuid:
    description: Athena project UUID
    required: true
  athena_db_path:
    description: Athena database path (project/proj_<uuid>.db)
    required: true
  athena_base_url:
    description: Athena server URL
    required: true
  athena_token:
    description: Athena bot token (nodes:read, nodes:write)
    required: true
  registry_username:
    description: GitLab registry username
    required: true
  registry_token:
    description: GitLab token with read_registry on idf/sync-athena
    required: true

runs:
  using: composite
  steps:
    - name: Log in to GitLab Container Registry
      uses: docker/login-action@v3
      with:
        registry: gitlab.espressif.cn:5050
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_token }}

    - name: Pull sync-athena image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: docker pull "$IMAGE"

    - name: Run sync-athena
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        MODE: ${{ inputs.mode }}
        REPO: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        EVENT_PATH: ${{ github.event_path }}
        ATHENA_TICKET_PREFIX: ${{ inputs.ticket_prefix }}
        ATHENA_EDITORS: ${{ inputs.editors }}
        ATHENA_CO_AUTHORS: ${{ inputs.co_authors }}
        ATHENA_EMAIL_DOMAIN: ${{ inputs.email_domain }}
        ATHENA_PROJECT_UUID: ${{ inputs.athena_project_uuid }}
        ATHENA_DB_PATH: ${{ inputs.athena_db_path }}
        ATHENA_BASE_URL: ${{ inputs.athena_base_url }}
        ATHENA_TOKEN: ${{ inputs.athena_token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        docker run --rm \
          -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
          -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
          -e MODE -e REPO -e EVENT_PATH -e ISSUE_NUMBER \
          -e ATHENA_PROJECT_UUID -e ATHENA_DB_PATH -e ATHENA_BASE_URL -e ATHENA_TOKEN \
          -e ATHENA_TICKET_PREFIX -e ATHENA_EDITORS -e ATHENA_CO_AUTHORS \
          -e ATHENA_EMAIL_DOMAIN \
          -e GITHUB_TOKEN -e GITHUB_OUTPUT \
          "$IMAGE"
